name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk quran-garden.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quran-garden-apk
          path: quran-garden.apk

      # Every build becomes the "latest" release. The app checks this release
      # and offers the update from inside the parents' panel.
      - name: Publish release (Download APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${GITHUB_RUN_NUMBER}"
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" quran-garden.apk \
            --title "حديقة القرآن ${TAG}" \
            --notes "${MSG}" \
            --latest
