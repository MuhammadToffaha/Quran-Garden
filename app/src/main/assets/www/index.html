<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حديقة القرآن</title>
<meta name="theme-color" content="#5DB36A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حديقة القرآن">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F3A2E;--green:#1E7A45;--leaf:#5DB36A;--sun:#F5B82E;--sand:#FFF8EC;--berry:#B5367A;--deep:#14532D;--sky:#9BD8F5;--sky2:#DDF3FC;--sky3:#A9D6EA;--bed:#E9F5DF;--soft:#FFF6D6;--line:#E3D3B5;--leaf2:#9ACB86;--leaf-d:#4CA35A;--wood:#C98A4B;--wood2:#8C5A2B;--paper:#FFFDF6;--green-d:#145A32}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--sand);color:var(--ink);font-family:'Baloo Bhaijaan 2','Noto Kufi Arabic',system-ui,sans-serif}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1E6FD9;outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto}

/* ---------- sky ---------- */
header{position:relative;background:linear-gradient(var(--sky),var(--sky2) 75%);padding:22px 20px 0;overflow:hidden}
.cloud{position:absolute;top:var(--t);left:-260px;opacity:.95;animation:drift var(--d) linear infinite;animation-delay:var(--dl);pointer-events:none}
@keyframes drift{to{transform:translateX(calc(100vw + 520px))}}
.sun{animation:spin 24s linear infinite;transform-origin:36px 36px}
@keyframes spin{to{transform:rotate(360deg)}}
.fly{position:absolute;pointer-events:none;animation:flyPath var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
.fly .w{transform-origin:20px 20px;animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.35)}}
@keyframes flyPath{0%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(-90px,-30px) rotate(8deg)}100%{transform:translate(-200px,20px) rotate(-4deg)}}
.hill{display:block;width:100%;height:60px;margin-top:-1px}

.top{position:relative;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:46px;font-weight:800;line-height:1.05;color:var(--deep);text-shadow:0 3px 0 #fff}
.sub{margin:4px 0 0;font-size:20px}
.parentBtn{min-height:48px;padding:8px 18px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.kids{position:relative;display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.kid{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 18px 6px 8px;border-radius:999px;font-size:19px;font-weight:800;border:3px solid var(--green);background:#fff;color:var(--green);transition:transform .15s}
.kid:hover{transform:translateY(-2px)}
.kid .av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:#FFF1C9;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{display:inline-flex;width:30px;height:30px;font-size:18px;vertical-align:middle;border-radius:50%;overflow:hidden;background:#FFF1C9;align-items:center;justify-content:center}
.av.lg{display:flex;width:72px;height:72px;font-size:42px;border-radius:50%;overflow:hidden;background:#FFF1C9;align-items:center;justify-content:center;border:3px solid var(--line);flex:0 0 72px}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px;font-size:18px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#toast[hidden]{display:none}
.linkbtn{background:none;border:0;color:#1E6FD9;text-decoration:underline;font-size:16px;min-height:44px;padding:0}
.kid.on{background:var(--green);color:#fff;transform:scale(1.06)}
.kid .fl{font-size:14px;background:#FFE7A3;color:#7A4B00;border-radius:999px;padding:0 8px}

.stats{position:relative;display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}
.card{flex:1 1 230px;background:#fff;border-radius:26px;padding:18px 22px;box-shadow:0 5px 0 var(--sky3)}
.card h3{margin:0;font-size:18px;font-weight:600}
.big{font-size:46px;font-weight:800;line-height:1.1}
.bar{height:18px;background:#F1E7D6;border-radius:999px;overflow:hidden;margin-top:8px}
.bar div{height:100%;background:repeating-linear-gradient(45deg,var(--leaf) 0 12px,var(--leaf-d) 12px 24px);border-radius:999px;transition:width .6s}
.ringWrap{display:flex;align-items:center;gap:14px}
.ring circle{transition:stroke-dashoffset .6s}
.next{flex:2 1 340px;background:var(--green);color:#fff;border-radius:26px;padding:18px 22px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 var(--green-d);position:relative;overflow:hidden}
.next .tag{align-self:flex-start;background:#FFE7A3;color:#7A4B00;border-radius:999px;padding:2px 12px;font-size:15px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 24px;font-size:20px;font-weight:800;min-height:50px;transition:transform .15s}
.pill:hover{transform:scale(1.05)}
.bounce{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- garden ---------- */
main{padding:24px 20px 80px;display:flex;flex-direction:column;gap:40px}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:12px 18px;border:3px dashed var(--line);font-size:17px}
.legend span{display:flex;align-items:center;gap:6px}
.zh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.sign{position:relative;background:var(--wood);color:#fff;border-radius:14px;padding:8px 22px 10px;box-shadow:0 5px 0 var(--wood2);transform:rotate(-1.2deg)}
.sign::before,.sign::after{content:"";position:absolute;bottom:-26px;width:10px;height:26px;background:var(--wood2);border-radius:0 0 4px 4px}
.sign::before{right:24px}.sign::after{left:24px}
.sign h2{margin:0;font-size:28px;font-weight:800}
.sign div{font-size:16px;color:#FFF3E2}
.badge{font-size:18px;font-weight:800;padding:6px 18px;border-radius:999px;background:#fff;border:3px solid var(--line)}
.badge.full{background:var(--sun);border-color:#B7791F;animation:bob 1.6s ease-in-out infinite}
.bed{background:var(--bed);border-radius:28px;padding:18px;border-bottom:10px solid #9C6B3C}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 10px;border-radius:24px;border:3px solid;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile.goal{border-width:4px;border-color:#B7791F!important;position:relative}
.tile.goal.notdone{border-style:dashed}
.tile.goal::after{content:"الهدف";position:absolute;top:-14px;background:#B7791F;color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:0 10px}
.grow{background:none;border:0;padding:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.num{font-size:14px;font-weight:800;color:#5B4A33;background:#fff;border-radius:999px;min-width:30px;padding:0 6px}
.plant{height:68px;display:flex;align-items:flex-end}
.plant.s3 svg{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(4deg)}}
.pop .plant svg{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.name{font-size:24px;font-weight:800;line-height:1.2}
.listen{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;width:100%;border-radius:999px;font-size:17px;font-weight:800;border:2px solid var(--green);background:#fff;color:var(--green)}
.listen.on{background:var(--green);color:#fff}
footer{text-align:center;font-size:16px}

/* ---------- player ---------- */
#player{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column}
#shead{background:linear-gradient(var(--sky),var(--sky2));padding:10px 16px 12px;border-bottom:6px solid var(--leaf)}
.shrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.back{min-height:48px;padding:6px 18px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px}
.stitle{font-size:32px;font-weight:800;line-height:1.05;color:var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:4px;min-height:44px;padding:2px 12px 2px 6px;border-radius:999px;border:2px solid #CFC2A8;background:#fff;color:var(--ink);font-size:15px;font-weight:800}
.chip.on{border-color:var(--green);background:var(--green);color:#fff}
.modes{display:flex;background:#fff;border-radius:999px;padding:4px;border:3px solid var(--green)}
.modes button{min-height:42px;border:0;border-radius:999px;padding:4px 16px;font-size:16px;font-weight:800;background:transparent;color:var(--green)}
.modes button.on{background:var(--green);color:#fff}
.race{background:#fff;border-radius:28px;padding:18px 20px;border:4px solid var(--sun);box-shadow:0 6px 0 #E3C27A;display:flex;flex-direction:column;gap:12px}
.lane{display:grid;grid-template-columns:minmax(150px,220px) 1fr 110px;gap:12px;align-items:center;padding:6px 8px;border-radius:16px}
.lane.me{background:var(--soft)}
.lname{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800}
.medal{font-size:24px}
.track{position:relative;height:40px;border-radius:999px;background:repeating-linear-gradient(90deg,var(--bed) 0 24px,#DDEFD1 24px 48px);border:3px solid var(--leaf2);overflow:visible}
.trackfill{position:absolute;top:0;bottom:0;right:0;border-radius:999px;background:var(--leaf2);opacity:.55;transition:width .8s}
.runner{position:absolute;top:2px;transition:right .8s}
.runner .av.sm{width:32px;height:32px;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.finish{position:absolute;left:8px;top:6px;font-size:14px;font-weight:800;color:#5B4A33}
.lpts{text-align:center;font-size:14px;line-height:1.2}.lpts b{font-size:22px;color:var(--berry)}
.qbtn{min-height:44px;border-radius:999px;border:3px solid #8E6BD8;background:#F2ECFF;color:#4B2E9B;font-size:16px;font-weight:800;padding:4px 16px}
.qbar{height:10px;border-radius:999px;background:#F1E7D6;overflow:hidden;margin-top:10px}.qbar div{height:100%;background:#8E6BD8}
.qopts{display:grid;gap:10px}
.qopt{min-height:56px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink);font-size:20px;font-weight:800;padding:8px 14px;text-align:right}
.qopt.qq{font-family:'Amiri Quran','Amiri',serif;font-size:24px;line-height:1.9;font-weight:400}
.qopt:hover:not([disabled]){border-color:#8E6BD8}
.qopt.ok{background:#DDF3D3;border-color:#2E8B57}.qopt.no{background:#FBE1E1;border-color:#A3262A}
@media (max-width:640px){.lane{grid-template-columns:1fr 90px}.lane .track{grid-column:1 / -1;grid-row:2}}
.growline{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px;background:#fff;border-radius:18px;padding:8px 14px;border:3px solid var(--leaf2)}
.growline .bar{height:14px}
.lcount{font-size:14px;font-weight:800;background:#fff;border-radius:999px;padding:0 10px;color:#5B4A33}
.tile .listen{font-size:15px}
.journey{display:flex;flex-direction:column;gap:12px}
.jhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:22px;border:3px solid var(--line);padding:12px 16px}
.hudrow{display:flex;flex-wrap:wrap;gap:8px}
.hudrow span{background:var(--soft);border:2px solid #E0A915;border-radius:999px;padding:2px 12px;font-weight:800;font-size:17px}
.nextstop2{background:var(--sun);color:var(--ink);border-radius:12px;padding:4px 14px;font-weight:800;font-size:16px}
.playbtn{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;min-height:56px;border-radius:999px;border:3px solid #fff;background:#E4572E;color:#fff;font-size:22px;font-weight:800;padding:6px 22px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.playbtn span{font-size:16px;background:rgba(255,255,255,.25);border-radius:999px;padding:0 10px}
.qtext.hide .w{color:transparent;background:#EFE6D4;border-radius:8px;user-select:none}
.qtext.hide .ay .w:first-child{color:#8C7B69;background:transparent}
.qtext.hide .ay.shown .w{color:inherit;background:transparent}
.qtext.hide .ay.cur{background:transparent;box-shadow:none}
.recbtn{width:96px;height:96px;border-radius:50%;border:6px solid #fff;background:#E4572E;color:#fff;font-size:40px;box-shadow:0 0 0 4px #E4572E}
.recdot{width:22px;height:22px;border-radius:50%;background:#E4572E;animation:pulse 1s infinite;margin:6px auto}
.recitem{border-top:2px solid #EFE6D4;padding:10px 0}
.updbanner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border:3px solid var(--sun);border-radius:20px;padding:12px 16px;font-size:18px}
.updst{font-size:15px;margin-top:4px}
.updnotes{margin-top:6px;font-size:15px;background:rgba(255,255,255,.6);border-radius:12px;padding:4px 10px}
.updnotes summary{cursor:pointer;font-weight:800;min-height:32px;display:flex;align-items:center;gap:6px}
.updnotes ul{margin:4px 0;padding-inline-start:20px}.updnotes p{margin:4px 0}.updnotes .nh{font-weight:800}
.lockpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.lockpad button{min-height:56px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:26px;font-weight:800;color:var(--ink)}
.whogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.whokid{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:130px;border-radius:20px;border:3px solid var(--line);background:#fff;color:var(--ink);font-size:18px;padding:10px}
.whokid.on{border-color:var(--green);background:#EEF8E8}
.kid.solo{cursor:default}
.famcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--soft);border:3px dashed #E0A915;border-radius:16px;padding:10px;user-select:all}
.rules{direction:ltr;text-align:left;background:var(--ink);color:#DDF3D3;border-radius:14px;padding:12px;font-size:14px;overflow-x:auto}
#dbUrl,#joinLinkIn{direction:ltr;text-align:left;font-size:15px}
.gamebtn{min-height:50px;border-radius:999px;border:3px solid var(--ink);background:#E4572E;color:#fff;font-size:19px;font-weight:800;padding:6px 20px;box-shadow:0 4px 0 var(--ink);animation:bob 1.4s ease-in-out infinite}
.gamebtn.onscene{position:absolute;bottom:8px;left:12px;z-index:5}
.gamebtn.off{background:#fff;color:var(--ink);font-size:15px;min-height:0;padding:4px 14px;animation:none;box-shadow:none;display:inline-block}
#gameOv{position:fixed;inset:0;z-index:58;background:var(--ink);direction:ltr}
#gameOv[hidden]{display:none}
#gameCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#gHud{position:absolute;top:12px;left:12px;right:70px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:flex-start}
#gHud span{background:rgba(255,255,255,.95);border:2px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:800;font-size:19px}
.gx{position:absolute;top:10px;right:12px;width:50px;height:50px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:22px;font-weight:800}
.gpad{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.gpad button{width:64px;height:64px;border-radius:18px;border:3px solid var(--ink);background:rgba(255,255,255,.88);font-size:28px;font-weight:800}
#gEnd{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);direction:rtl;width:min(92%,460px)}
.subway{position:relative;height:240px;border-radius:28px;overflow:hidden;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);background:linear-gradient(#6EC1EE,#C9EBFB 70%)}
.skyline{position:absolute;bottom:64px;left:-1600px;fill:#7FA3BC;animation:city 26s linear infinite}
.skyline .win{fill:#FFE7A3}
@keyframes city{to{transform:translateX(1600px)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:66px;background:#5E5246;border-top:6px solid #8C7B69}
.ground::before{content:"";position:absolute;inset:14px 0 auto 0;height:36px;background:repeating-linear-gradient(90deg,#3B3129 0 12px,transparent 12px 44px);animation:sleepers .45s linear infinite}
.ground::after{content:"";position:absolute;left:0;right:0;top:18px;height:28px;border-top:5px solid #C9CED4;border-bottom:5px solid #C9CED4}
@keyframes sleepers{to{background-position:44px 0}}
.barrier{position:absolute;bottom:60px;left:-60px;width:46px;height:34px;border-radius:6px;background:repeating-linear-gradient(45deg,#E4572E 0 8px,#fff 8px 16px);border:3px solid var(--ink);z-index:2;animation:runby 3s linear infinite}
@keyframes runby{to{left:110%}}
.coinrow{position:absolute;bottom:128px;left:-320px;display:flex;gap:30px;z-index:2;animation:runby 3.6s linear infinite;animation-delay:-1.2s}
.coinrow i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF3B0,var(--sun) 55%,#C98A1B);border:2px solid #9C6B1B;animation:coin .8s linear infinite}
@keyframes coin{50%{transform:scaleX(.25)}}
.hero{position:absolute;right:13%;bottom:56px;width:60px;height:100px;z-index:3;animation:jump 3s ease-in-out infinite}
.hero .av{position:absolute;top:0;left:7px;width:46px;height:46px;border-radius:50%;overflow:hidden;background:#FFF1C9;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.hero svg{position:absolute;top:42px;left:0}
.hero .leg{transform-box:fill-box;transform-origin:top center;animation:leg .28s ease-in-out infinite alternate}
.hero .leg.b{animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@keyframes jump{0%,62%{transform:translateY(0)}70%,80%{transform:translateY(-70px)}90%,100%{transform:translateY(0)}}
.hud{position:absolute;top:10px;right:12px;left:12px;display:flex;flex-wrap:wrap;gap:8px;z-index:4}
.hud span{background:rgba(255,255,255,.94);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-size:17px}
.nextstop{position:absolute;bottom:8px;right:12px;z-index:4;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:2px 12px;font-weight:800;font-size:16px}
.stations{display:flex;overflow-x:auto;padding:12px 6px 8px;background:#fff;border-radius:22px;border:3px solid var(--line)}
.st{flex:0 0 84px;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:var(--ink);font-size:14px;font-weight:800;min-height:84px}
.st::before{content:"";position:absolute;top:24px;left:0;right:0;height:6px;background:#D8CCB4}
.st .dot{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid #D8CCB4;font-size:20px;overflow:hidden}
.st .dot img{width:100%;height:100%;object-fit:cover}
.st.done::before{background:#E0A915}.st.done .dot{background:var(--soft);border-color:#E0A915}
.st.cur .dot{border-color:var(--green);box-shadow:0 0 0 6px rgba(93,179,106,.35);animation:bob 1.2s ease-in-out infinite}
.st.wilt .dot{border-color:#A3262A;background:#FBE1E1}
.st.lock{opacity:.45}
.board{display:flex;flex-wrap:wrap;gap:8px}
.bchip{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;font-weight:800;font-size:16px}
.bchip.me{border-color:var(--green);background:#EEF8E8}
.review{background:#fff;border-radius:24px;padding:14px 18px;border:4px dashed #8E6BD8}
.rchip{min-height:46px;border-radius:999px;border:3px solid #8E6BD8;background:#F2ECFF;color:#4B2E9B;font-size:17px;font-weight:800;padding:4px 16px}
.tile.locked{opacity:.6;filter:grayscale(.5);display:flex;flex-direction:column;align-items:center;gap:6px}
.tile.wilt .plant svg{filter:grayscale(.75) sepia(.35);transform:rotate(-14deg);animation:none}
.wiltb{font-size:13px;font-weight:800;color:#A3262A;background:#FBE1E1;border-radius:999px;padding:0 10px}
.wiltb.ok{color:var(--green);background:#DDF3D3}
#pctrl{background:var(--ink);color:#fff;padding:12px 16px 16px;border-top:6px solid var(--sun)}
.hint{font-size:14px;color:#CFE8D6}
#player[hidden]{display:none}
.prow{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center}
.play{width:66px;height:66px;flex:0 0 66px;border-radius:50%;border:0;background:var(--sun);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #B7791F}
.play.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(245,184,46,.25),0 4px 0 #B7791F}}
.steps{display:flex;flex-wrap:wrap;gap:12px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;background:#2C4F3E;border-radius:16px;padding:8px 10px;font-size:14px}
.step div{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:24px;font-weight:800;line-height:1}
.step b{min-width:40px;text-align:center;font-size:24px}
.ghost{min-height:44px;padding:6px 18px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;font-size:17px;font-weight:800}
.status{font-size:17px;font-weight:600;color:#FFE7A3}
#reader{position:relative;flex:1;min-height:0;overflow-y:auto;background:var(--paper);color:var(--ink);padding:18px 20px 60px;scroll-behavior:smooth}
#reader .qtext{max-width:1000px;margin:0 auto}
#reader[hidden]{display:none}
.qtext{font-family:'Amiri Quran','Amiri',serif;font-size:clamp(26px,3.6vw,38px);line-height:2.3;text-align:justify;margin:0}
.qtext .bas{display:block;text-align:center;color:var(--green)}
.ay{border-radius:12px;padding:2px 2px;transition:background .3s}
.ay{cursor:pointer}
.ay:hover{background:#F4F9EF}
.ay.cur{background:#FFE7A3;box-shadow:0 0 0 3px var(--sun)}
.ay.out{opacity:.35}
.w{border-radius:10px;padding:0 3px;transition:background .15s,color .15s,box-shadow .15s}
.w.done{color:var(--green)}
.w.now{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 #B7791F}
.anum{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:50%;border:2px solid var(--wood);color:var(--wood2);font-family:'Baloo Bhaijaan 2',sans-serif;font-size:16px;font-weight:800;margin:0 6px;vertical-align:middle;line-height:1}
.rmsg{font-size:17px;text-align:center;margin:6px 0}
.err{margin-top:10px;background:#FFE7A3;color:var(--ink);border-radius:12px;padding:8px 14px;font-size:16px}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,40,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.overlay[hidden]{display:none}
.modal{background:#fff;border-radius:28px;width:min(100%,560px);padding:24px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.modal.wide{width:min(100%,980px);padding:0;overflow:hidden}
.modal h2{margin:0 0 6px;font-size:28px}
.field{display:flex;flex-direction:column;gap:4px;font-size:16px;font-weight:600}
.field input,.field select{min-height:46px;border-radius:14px;border:2px solid #CFC2A8;padding:6px 12px;font-size:18px;background:#fff}
.btn{min-height:46px;border-radius:999px;border:0;padding:8px 20px;font-size:17px;font-weight:800;background:var(--green);color:#fff}
.btn.alt{background:#fff;color:var(--green);border:2px solid var(--green)}
.btn.danger{background:#fff;color:#A3262A;border:2px solid #A3262A}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ptop{background:var(--ink);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ptop h2{margin:0;font-size:26px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 0;background:#F4EEE2;border-bottom:2px solid var(--line)}
.tabs button{min-height:44px;border:0;border-radius:14px 14px 0 0;padding:6px 18px;font-size:17px;font-weight:800;background:transparent;color:var(--ink)}
.tabs button.on{background:#fff;box-shadow:0 -2px 0 var(--line) inset}
.pbody{padding:20px 24px 28px;display:flex;flex-direction:column;gap:18px}
.box{border:2px solid #EFE6D4;border-radius:20px;padding:16px}
.box h3{margin:0 0 10px;font-size:20px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.kstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.kstat div{background:#F7F2E7;border-radius:14px;padding:6px}
.kstat b{display:block;font-size:24px}
.zbar{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:4px}
.zbar span:first-child{flex:0 0 120px}
.zbar .bar{flex:1;height:12px;margin:0}
.avpick{display:flex;flex-wrap:wrap;gap:6px}
.avpick button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;background:#FFF1C9;font-size:24px}
.avpick button.on{border-color:var(--green)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:17px}
.switch input{width:26px;height:26px}
.note{font-size:14px;color:#5B4A33}

/* ---------- celebration ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.cheer{text-align:center}
.cheer .em{font-size:84px;line-height:1;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.cheer h2{font-size:34px;margin:10px 0 4px}

html{background:var(--sand)}
/* ---------- app-wide text size (parents can change it) ---------- */
:root{--ui:.85}
header,main,.overlay>.modal,#gEnd,#toast,#shead,#pctrl{zoom:var(--ui)}
#reader{zoom:calc(var(--ui) + .1)}
/* ---------- full-page reading while the recitation plays ---------- */
.focusPause{display:none}
#player.focus #shead,#player.focus #pctrl{display:none}
#player.focus #reader{padding-top:28px;padding-bottom:110px}
#player.focus .focusPause{display:flex;position:absolute;bottom:22px;left:22px;z-index:3;width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:var(--ink);color:#fff;align-items:center;justify-content:center;opacity:.85;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#player.focus .focusPause:hover{opacity:1}
/* ---------- tajweed ---------- */
.qtext.tjon .tj-madda_necessary{color:#B71C1C}
.qtext.tjon .tj-madda_obligatory{color:#E53935}
.qtext.tjon .tj-madda_permissible{color:#F4511E}
.qtext.tjon .tj-madda_normal{color:#D9822B}
.qtext.tjon .tj-ghunnah{color:#16A34A}
.qtext.tjon .tj-ikhfa{color:#0E9F6E}
.qtext.tjon .tj-ikhfa_shafawi{color:#0E9F6E}
.qtext.tjon .tj-idgham_ghunnah{color:#15803D}
.qtext.tjon .tj-idgham_shafawi{color:#15803D}
.qtext.tjon .tj-iqlab{color:#2E7D32}
.qtext.tjon .tj-idgham_wo_ghunnah{color:#7F8C8D}
.qtext.tjon .tj-idgham_mutajanisayn{color:#7F8C8D}
.qtext.tjon .tj-idgham_mutaqaribayn{color:#7F8C8D}
.qtext.tjon .tj-qalaqah{color:#1D6FD8}
.qtext.tjon .tj-ham_wasl{color:#9AA0A6}
.qtext.tjon .tj-laam_shamsiyah{color:#9AA0A6}
.qtext.tjon .tj-slnt{color:#9AA0A6}
.qtext.tjon .w.now .tj{filter:brightness(.8)}
.tjlegend{display:flex;flex-wrap:wrap;gap:6px;max-width:1000px;margin:0 auto 8px;justify-content:center}
.tjchip{display:flex;align-items:center;gap:6px;min-height:36px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:800;padding:2px 12px}
.tjchip i{width:14px;height:14px;border-radius:50%;display:inline-block}
/* ---------- plan + certificates ---------- */
.plancard{background:#fff;border-radius:22px;padding:14px 16px;border:4px solid var(--sun);box-shadow:0 5px 0 #E8C766}
.plancard.done{text-align:center;font-size:20px}
.ptag{display:inline-block;background:var(--soft);border-radius:999px;padding:1px 12px;font-weight:800;font-size:15px}
.pmain{font-size:24px;font-weight:800;margin-top:4px}.pmain span{font-size:18px;color:var(--green)}
.psub{font-size:15px;margin-top:2px}
.certimg{display:block;width:100%;height:auto;border-radius:12px;margin-top:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.certgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.certitem{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;border-radius:16px;border:3px solid var(--line);background:#FFFDF6;color:var(--ink);font-size:15px;padding:8px}
.certitem small{color:#7A4B00}
/* ---------- meaning ---------- */
.mbox{background:var(--soft);border-radius:18px;padding:12px 14px;margin-top:12px;font-size:17px;line-height:1.8}
.mbox p{margin:6px 0 0}
.mbox.story{background:#F2ECFF}
.mbox.quizq{background:#E9F5DF}
.mayah{border-top:2px dashed var(--line);padding:8px 0}
.mayah p{font-size:16px}
/* ---------- badges ---------- */
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge2{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;border-radius:20px;padding:12px 8px;background:#F4F1EA;border:3px solid #E6DFCF;opacity:.75}
.badge2.got{background:#FFF6D6;border-color:#E0A915;opacity:1;box-shadow:0 4px 0 #E8C766}
.badge2 .bic{font-size:40px;line-height:1.2}
.badge2.got .bic{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.badge2 small{font-size:13px;color:#5B4A33}
.bdate{font-size:12px;color:#7A4B00}
.bprog{display:block;width:80%;height:8px;border-radius:999px;background:#E3DCCB;overflow:hidden;direction:ltr}
.bprog i{display:block;height:100%;background:var(--leaf)}
/* ---------- journey scene ---------- */
:root{--js1:#7CC8EE;--js2:#DDF3FC;--jh1:#9FD38A;--jh2:#7DC067;--jh3:#62AE4E;--jroad:#F2CF3E;--jedge:#D9AE1E}
body[data-theme="sea"]{--js1:#5BB8E6;--js2:#E3F6FF;--jh1:#9ED8C6;--jh2:#6FC3B0;--jh3:#4FAE98;--jroad:#F6E3B4;--jedge:#D9BE7E}
body[data-theme="desert"]{--js1:#FFB27A;--js2:#FFE7CC;--jh1:#F1C98B;--jh2:#E5B36E;--jh3:#D69B52;--jroad:#FFE9A8;--jedge:#E0B95C}
body[data-theme="space"]{--js1:#251A5E;--js2:#5E46B0;--jh1:#6B57B8;--jh2:#5642A0;--jh3:#433188;--jroad:#FFD95A;--jedge:#D9A92A}
body[data-theme="rose"]{--js1:#FFB3CF;--js2:#FFEAF2;--jh1:#B9E0A0;--jh2:#9CD283;--jh3:#7FC36A;--jroad:#FFE08A;--jedge:#E5B94E}
.jscene{position:relative;height:440px;border-radius:26px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 0 var(--line)}
.jsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.jcard{position:absolute;transform:translate(-50%,-62%);display:flex;align-items:center;gap:12px;min-width:250px;padding:10px 14px;border-radius:999px;border:5px solid #8FD4A9;background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.12);z-index:3}
.jnum{flex:0 0 56px;height:56px;border-radius:50%;border:4px solid #E9D9A6;background:#FFFBEF;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.jname{display:flex;flex-direction:column;align-items:stretch;gap:4px;flex:1;text-align:center}
.jname b{font-family:'Amiri Quran','Amiri',serif;font-weight:400;font-size:24px;line-height:1.5}
.jname small{font-size:14px;color:#5B4A33;text-align:start}
.jbar{display:block;height:8px;border-radius:999px;background:#E6E9EE;overflow:hidden;direction:ltr}
.jbar i{display:block;height:100%;background:#F2B705;border-radius:999px}
.jstop{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #fff;background:#FFFBEF;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:0;z-index:2;font-size:18px}
.jstop[disabled]{opacity:.75}
.jline{position:absolute;left:22%;right:22%;height:3px;background:linear-gradient(90deg,transparent,var(--leaf-d) 20%,var(--leaf-d) 80%,transparent);z-index:1;transform:translateY(-50%);opacity:.7}
.kidchar{position:absolute;left:6%;bottom:6%;width:120px;z-index:4;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.khead{position:relative;width:84px;height:84px;margin:0 auto -14px;border-radius:50%;overflow:hidden;background:#FFF1C9;display:flex;align-items:center;justify-content:center;font-size:52px;z-index:1}
.khead img{width:100%;height:100%;object-fit:cover}
.kbody{display:block;margin:0 auto}
.jorb{position:absolute;top:8%;left:9%;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFF3B0,#FFD24A 60%,#F5B82E);box-shadow:0 0 0 10px rgba(255,217,90,.25);z-index:1}
.jorb.moon{background:radial-gradient(circle at 35% 35%,#FFFDF0,#F3E7C2);box-shadow:0 0 18px 4px rgba(255,255,230,.35)}
.jlab{position:absolute;transform:translate(26px,-50%);background:rgba(255,255,255,.92);border-radius:999px;padding:1px 10px;font-size:14px;font-weight:800;z-index:2;white-space:nowrap}
.jphoto{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.jphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 55%,rgba(0,0,0,.25))}
.jscene.hasphoto .jbg{display:none}
.jscene.hasphoto .jsvg{z-index:1}
.jcredit{position:absolute;bottom:6px;right:10px;z-index:3;max-width:60%;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.jdone{position:absolute;top:12px;right:12px;z-index:3;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}

  .jname b{font-size:20px}
  .kidchar{left:2%;bottom:4%;transform:scale(.8);transform-origin:bottom left}
}
/* ---------- themes ---------- */
body[data-theme="sea"]{--ink:#12324A;--green:#0F6E8C;--leaf:#3BA7C9;--sun:#FFB547;--sand:#F0F9FF;--deep:#0B3D5C;--sky:#7FD0F0;--sky2:#E3F6FF;--sky3:#9CCFE4;--bed:#DDF2FA;--soft:#FFF4DA;--line:#BFD9E6;--leaf2:#8CC9DF;--leaf-d:#2E8FB0;--wood:#2F8FB0;--wood2:#1D6A85;--paper:#FAFDFF;--green-d:#0B4F66;--berry:#B03A6F}
body[data-theme="desert"]{--ink:#4A2A14;--green:#B5541C;--leaf:#E8914A;--sun:#FFC93C;--sand:#FFF5E8;--deep:#7A3510;--sky:#FFC59E;--sky2:#FFEBD6;--sky3:#F2BE95;--bed:#FBE7D2;--soft:#FFF1D0;--line:#EBCFAE;--leaf2:#F0B07A;--leaf-d:#C9743A;--wood:#A0522D;--wood2:#6E3517;--paper:#FFFBF5;--green-d:#7F3912;--berry:#9C2F5E}
body[data-theme="space"]{--ink:#2B1F4A;--green:#6A3FB5;--leaf:#9C7BE0;--sun:#FFC94A;--sand:#F7F3FF;--deep:#3E2380;--sky:#B9A6F2;--sky2:#ECE6FF;--sky3:#C6B8EE;--bed:#ECE5FB;--soft:#FFF4D6;--line:#D6CCEE;--leaf2:#BBA6EC;--leaf-d:#7F5FD0;--wood:#7A55C9;--wood2:#4F3591;--paper:#FDFBFF;--green-d:#4A2B86;--berry:#B5367A}
body[data-theme="rose"]{--ink:#4A1F33;--green:#B03A6F;--leaf:#E679A6;--sun:#FFC24B;--sand:#FFF5F8;--deep:#7E2450;--sky:#FFC1D8;--sky2:#FFE9F1;--sky3:#F2B3CB;--bed:#FCE4EE;--soft:#FFF3D9;--line:#EFC9D8;--leaf2:#F2A6C4;--leaf-d:#D0628F;--wood:#C25683;--wood2:#8A2F58;--paper:#FFFBFC;--green-d:#7E2450;--berry:#7E2450}

  ['prog','days','aw','zd','quiz','lp','al','ready','rev','memAt','recs','meant','badges','flags'].forEach(function(f){if(!k[f]||typeof k[f]!=='object')k[f]={};});

function kidSummary(k){

  var today=k.days[dkey()]||0,streak=0,d=new Date();
  if(!k.days[dkey(d)])d.setDate(d.getDate()-1);

/* ---------- sounds ---------- */
var AC=null;
function chime(notes){
  if(!D.set.sfx)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;
    notes.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(.18,t+i*.12+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.5);
      o.connect(g);g.connect(AC.destination);o.start(t+i*.12);o.stop(t+i*.12+.55);});}catch(e){}
}

/* ---------- confetti ---------- */
var cv=document.getElementById('confetti'),cx=cv.getContext('2d'),parts=[],raf=null;
function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  var cols=['#F5B82E','#E46A8E','#5DB36A','#3E9BD6','#8E6BD8','#F28C38'];
  for(var i=0;i<(n||140);i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,
    r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4,life:0});
  if(!raf)tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){return p.life<160&&p.y<cv.height+20;});
  parts.forEach(function(p){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,cv.width,cv.height),null);
}
function cheer(icon,title,text){
  chime([523,659,784,1047]);confetti(160);
  var b=document.getElementById('cheerBox');
  b.innerHTML='<div class="em">'+icon+'</div><h2>'+title+'</h2><p style="font-size:20px;margin:0 0 18px">'+text+'</p><button class="pill" style="background:var(--sun);color:var(--ink)" data-close="cheerOv">الحمد لله!</button>';
  document.getElementById('cheerOv').hidden=false;b.querySelector('button').focus();
}

/* ---------- parents' password ---------- */
var gateCb=null,gateMode='enter',gateTitle='',gateAns=0;
function hashPw(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'h'+(h>>>0).toString(36)+'.'+s.length;}
function normDigits(v){return String(v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).trim();}
function gate(title,cb){gateCb=cb;gateTitle=title;gateMode=D.pin?'enter':'setup';drawGate();document.getElementById('gateOv').hidden=false;}
function changePassword(){gateCb=function(){toast('تم تغيير كلمة المرور ✔');};gateTitle='';gateMode='setup';drawGate();document.getElementById('gateOv').hidden=false;}
function drawGate(msg){
  var h='',pw='<input type="password" autocomplete="off" style="min-height:52px;font-size:22px;letter-spacing:4px"';
  if(gateMode==='setup'){
    h='<h2 id="gateT">🔐 كلمة مرور الوالدين</h2><p style="font-size:17px;margin:0 0 12px">'+(msg||'أنشئ كلمة مرور (٤ أحرف أو أرقام على الأقل). لا تخبر بها الأولاد!')+'</p>'+
      '<label class="field"><span>كلمة المرور الجديدة</span>'+pw+' id="gp1"></label>'+
      '<label class="field" style="margin-top:10px"><span>أعد كتابتها</span>'+pw+' id="gp2"></label>';
  } else if(gateMode==='enter'){
    h='<h2 id="gateT">🔐 '+gateTitle+'</h2><p style="font-size:17px;margin:0 0 12px">اكتب كلمة مرور الوالدين.</p>'+
      '<label class="field"><span>كلمة المرور</span>'+pw+' id="gp1"></label>';
  } else {
    var a=12+Math.floor(Math.random()*8),b=6+Math.floor(Math.random()*4);gateAns=a*b;
    h='<h2 id="gateT">نسيت كلمة المرور؟</h2><p style="font-size:17px;margin:0 0 12px">للكبار: ما ناتج <b style="font-size:24px">'+ar(a)+' × '+ar(b)+'</b>؟ بعدها تنشئ كلمة مرور جديدة. (التقدّم لن يُمسح)</p>'+
      '<label class="field"><span>الجواب</span><input id="gp1" inputmode="numeric" autocomplete="off" style="min-height:52px;font-size:22px"></label>';
  }
  h+='<p id="gateErr" style="color:#A3262A;min-height:24px;font-size:16px;font-weight:600;margin:8px 0">'+(msg&&gateMode!=='setup'?msg:'')+'</p>'+
    '<div class="row"><button class="btn" data-gate="ok">'+(gateMode==='setup'?'حفظ':'دخول')+'</button><button class="btn alt" data-gate="cancel">إلغاء</button>'+
    (gateMode==='enter'?'<button class="linkbtn" data-gate="forgot">نسيت كلمة المرور؟</button>':'')+'</div>';
  document.getElementById('gateBox').innerHTML=h;
  setTimeout(function(){var i=document.getElementById('gp1');i&&i.focus();},30);
}
function gateErr(m){document.getElementById('gateErr').textContent=m;}
function gateFinish(){document.getElementById('gateOv').hidden=true;var c=gateCb;gateCb=null;c&&c();}
function gateOk(){
  var v1=normDigits(document.getElementById('gp1').value);
  if(gateMode==='setup'){
    var v2=normDigits(document.getElementById('gp2').value);
    if(v1.length<4)return gateErr('كلمة المرور ٤ أحرف أو أرقام على الأقل.');
    if(v1!==v2)return gateErr('الكلمتان غير متطابقتين.');
    D.pin=hashPw(v1);save();gateFinish();
  } else if(gateMode==='enter'){
    if(hashPw(v1)===D.pin)gateFinish();else{gateErr('كلمة المرور غير صحيحة.');document.getElementById('gp1').value='';}
  } else {
    if(parseInt(v1,10)===gateAns){gateMode='setup';drawGate('أنشئ كلمة مرور جديدة.');}else gateErr('الجواب غير صحيح.');
  }
}

function repA(){return S.mode==='memo'?D.set.ayahRep:1;}

function advance(){
  var s=S.sel;if(!s||!S.playing)return;
  if(S.phase==='b'){S.phase='a';load(ayahUrl(s,S.cur));}
  else if(S.aRep<repA()){S.aRep++;load(ayahUrl(s,S.cur));}
  else if(S.cur<S.to){S.cur++;S.aRep=1;load(ayahUrl(s,S.cur));}
  else if(S.rRep<repR()){S.rRep++;S.cur=S.from;S.aRep=1;S.phase=needsBasmala(s,S.from)?'b':'a';
    load(S.phase==='b'?ayahUrl(1,1):ayahUrl(s,S.from));}
  else{S.playing=false;S.done=true;chime([659,784,1047]);confetti(70);}

}

/* ---------- growing ---------- */
/* ---------- points, race & money ---------- */
function stagePts(st,n){return st===1?5:st===2?10:st===3?20+SURAHS[n][1]:0;}
function addPts(k,pts,why){
  if(!pts)return;k.points=(k.points||0)+pts;
  k.log=k.log||[];k.log.unshift({d:dkey(),p:pts,r:why});if(k.log.length>60)k.log.length=60;
}
function stageAward(k,n,nx){
  var best=k.aw[n]||0,pts=0;
  for(var st=best+1;st<=nx;st++)pts+=stagePts(st,n);
  if(nx>best)k.aw[n]=nx;
  addPts(k,pts,'سورة '+SURAHS[n][0]+' — '+LABELS[nx]);return pts;
}
function moneyOf(pts){var m=D.set.money;return Math.floor(pts/m.per*m.amt*100)/100;}
function unpaid(k){return Math.max(0,(k.points||0)-(k.paid||0));}
function fmtMoney(v){return ar(v)+' '+esc(D.set.money.cur);}

function doGrow(n,target){
  var k=K(),cur=k.prog[n]||0,nx=target==null?(cur+1)%4:target;if(nx===cur)return;
  var wasBest=k.aw[n]||0;
  k.prog[n]=nx;var gained=stageAward(k,n,nx);
  if(nx===3){k.memAt[n]=dkey();k.rev[n]=dkey();}
  var gameWon=nx===3&&wasBest<3&&D.set.gameMin>0;
  if(gameWon)k.gameMs=(k.gameMs||0)+D.set.gameMin*60000;
  var zi=-1;ZONES.forEach(function(z,i){if(z.nums.indexOf(n)>=0)zi=i;});
  var z=ZONES[zi],zoneDone=nx===3&&z.nums.every(function(m){return (k.prog[m]||0)===3;}),bonus=0,first=false;
  if(zoneDone&&!k.zd[zi]){
    first=!D.kids.some(function(o){return o!==k&&o.zd&&o.zd[zi];});
    k.zd[zi]=dkey();bonus=(z.nums.length>1?100:20)+(first&&D.kids.length>1?50:0);
    addPts(k,bonus,(first&&D.kids.length>1?'🥇 أول من أكمل ':'إكمال ')+z.title);
  }
  save();S.justGrew=n;render();S.justGrew=null;
  var ptsTxt=((gained+bonus)?' <b>+'+ar(gained+bonus)+' نقطة ⭐</b>':'')+(gameWon?'<br><b>🎮 وربحت '+ar(D.set.gameMin)+' دقائق لعب!</b>':'');
  if(nx===3)setTimeout(function(){var cb=document.getElementById('cheerBox');if(cb&&!document.getElementById('cheerOv').hidden)cb.insertAdjacentHTML('beforeend','<div style="margin-top:10px"><button class="pill" style="background:#fff;color:var(--green);border:3px solid var(--green)" data-cert="'+(zoneDone&&ZONES[zi].nums.length>1?'z'+zi:'s'+n)+'">📜 شهادتي</button></div>');},0);
  if(gameWon)setTimeout(function(){var cb=document.getElementById('cheerBox');if(cb&&!document.getElementById('cheerOv').hidden)cb.insertAdjacentHTML('beforeend','<div style="margin-top:10px"><button class="playbtn" data-game>🎮 العب شوية</button></div>');},0);
  if(nx===3){
    if(n===36&&zoneDone)cheer('🏆','وصلت إلى سورة يس!','أزهرت حديقتك كلها يا '+esc(k.name)+'. فخورون بك جداً!'+ptsTxt);
    else if(zoneDone&&first&&D.kids.length>1)cheer('🥇','وصلت أولاً!','أنت أول من أكمل '+z.title+' يا '+esc(k.name)+'!'+ptsTxt);
    else if(zoneDone&&z.nums.length>1)cheer('🌻','أزهر '+z.title+'!','أكملت البستان كله. ما شاء الله يا '+esc(k.name)+'!'+ptsTxt);
    else cheer('🌸',pick(CHEERS),'حفظت سورة '+SURAHS[n][0]+'. صارت زهرة جميلة في حديقتك!'+ptsTxt);
  } else if(nx>0){chime(nx===1?[523,659]:[587,740]);if(gained)toast('+'+ar(gained)+' نقطة ⭐');}
}
/* growth comes from real listening: every ayah must be heard fully N times */
function passes(k,s){var arr=k.al[s]||[],m=Infinity;for(var a=1;a<=SURAHS[s][1];a++)m=Math.min(m,arr[a]||0);return m===Infinity?0:m;}
function autoStage(k,s){var m=passes(k,s),T=D.set;return m>=T.t3?3:m>=T.t2?2:m>=T.t1?1:0;}
function recordListen(s,a){
  if(!s||!a)return;var k=K(),arr=k.al[s]||(k.al[s]=[]);arr[a]=(arr[a]||0)+1;
  if(S.heardFor!==s){S.heard={};S.heardFor=s;}S.heard[a]=1;
  try{planCheckDone(k);}catch(e){}
  if((k.prog[s]||0)===3&&Object.keys(S.heard).length>=SURAHS[s][1]&&k.rev[s]!==dkey()){
    k.rev[s]=dkey();S.heard={};k.revCount=(k.revCount||0)+1;addPts(k,10,'مراجعة سورة '+SURAHS[s][0]);
    if(D.set.gameRevMin>0)k.gameMs=(k.gameMs||0)+D.set.gameRevMin*60000;

/* ---------- 📅 smart plan: target surah + deadline → today's portion ---------- */
function dateFromKey(s){var p=String(s||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null;}
function daysBetween(a,b){return Math.round((dateFromKey(b)-dateFromKey(a))/864e5);}
function planActive(k){return !!(k.planCfg&&k.planCfg.deadline&&k.planCfg.to!=null);}
function planTargets(k){var to=Math.min(k.planCfg.to,ORDER.length-1);return ORDER.slice(0,to+1);}
function planFixPos(k){
  var T=planTargets(k),pos=k.planPos;
  if(!pos||T.indexOf(pos.s)<0||k.prog[pos.s]===3||pos.a>SURAHS[pos.s][1]){
    var start=pos&&T.indexOf(pos.s)>=0?T.indexOf(pos.s)+(pos.a>SURAHS[pos.s][1]||k.prog[pos.s]===3?1:0):0;
    pos=null;for(var i=start;i<T.length;i++){if(k.prog[T[i]]!==3){pos={s:T[i],a:1};break;}}
    if(!pos)for(var j=0;j<T.length;j++){if(k.prog[T[j]]!==3){pos={s:T[j],a:1};break;}}
    k.planPos=pos;
  }
  return k.planPos;
}
function planRemaining(k){
  var pos=planFixPos(k);if(!pos)return 0;var T=planTargets(k),r=0,seen=false;
  T.forEach(function(n){if(k.prog[n]===3)return;if(n===pos.s){seen=true;r+=SURAHS[n][1]-pos.a+1;}else if(seen||T.indexOf(n)>T.indexOf(pos.s))r+=SURAHS[n][1];});
  return r;
}
function planInfo(k){
  if(!planActive(k))return null;
  var today=dkey(),left=Math.max(1,daysBetween(today,k.planCfg.deadline)+1),rem=planRemaining(k),
      daily=Math.max(1,Math.ceil(rem/left)),total=Math.max(1,daysBetween(k.planCfg.start,k.planCfg.deadline)+1),
      gone=Math.max(0,daysBetween(k.planCfg.start,today)),expected=Math.max(0,(k.planCfg.startRem||rem)*(1-gone/total)),status='on';
  if(rem===0)status='done';else if(daysBetween(today,k.planCfg.deadline)<0)status='late';
  else if(rem>expected*1.1+2)status='behind';else if(rem<expected*0.9-2)status='ahead';
  return {left:left,rem:rem,daily:daily,status:status,hard:daily>20};
}
function planToday(k){
  var info=planInfo(k);if(!info||info.status==='done')return null;
  var today=dkey(),pd=k.planDay;
  if(pd&&pd.date===today)return pd;
  var pos=planFixPos(k);if(!pos)return null;
  var n=pos.s,f=pos.a,t=Math.min(SURAHS[n][1],f+info.daily-1),arr=k.al[n]||[],base={};
  for(var a=f;a<=t;a++)base[a]=arr[a]||0;
  k.planDay={date:today,s:n,from:f,to:t,base:base,done:false};save();return k.planDay;
}
function planPortionProgress(k,pd){
  var arr=k.al[pd.s]||[],need=D.set.t3,got=0,tot=pd.to-pd.from+1;
  for(var a=pd.from;a<=pd.to;a++)got+=Math.min(need,(arr[a]||0)-(pd.base[a]||0));
  return Math.max(0,Math.min(1,got/(need*tot)));
}
function planCheckDone(k){
  var pd=k.planDay;if(!pd||pd.done||pd.date!==dkey())return;
  if(planPortionProgress(k,pd)<1)return;
  pd.done=true;k.planDone=(k.planDone||0)+1;k.planPos={s:pd.s,a:pd.to+1};planFixPos(k);
  addPts(k,10,'حصة اليوم: '+SURAHS[pd.s][0]+' '+pd.from+'–'+pd.to);save();
  setTimeout(function(){cheer('📅','أنهيت حصة اليوم!','حفظت سورة '+SURAHS[pd.s][0]+' من الآية '+ar(pd.from)+' إلى '+ar(pd.to)+'. +١٠ نقاط ⭐');},600);
}

function sha256hex(str){
  function rr(v,n){return (v>>>n)|(v<<(32-n));}
  var K=[],H=[],n=0,c=2,i,j;

  function frac(x){return ((x-Math.floor(x))*4294967296)|0;}
  while(n<64){if(isP(c)){if(n<8)H[n]=frac(Math.pow(c,1/2));K[n]=frac(Math.pow(c,1/3));n++;}c++;}
  var s=unescape(encodeURIComponent(str)),bl=s.length*8;
  s+='\x80';while(s.length%64!==56)s+='\x00';
  var w=[];for(i=0;i<s.length;i++)w[i>>2]|=s.charCodeAt(i)<<((3-i%4)*8);
  w.push((bl/4294967296)|0);w.push(bl|0);
  for(j=0;j<w.length;j+=16){
    var W=w.slice(j,j+16),a=H[0],b=H[1],cc=H[2],d=H[3],e=H[4],f=H[5],g=H[6],hh=H[7];
    for(i=0;i<64;i++){
      if(i>=16){var x=W[i-15],y=W[i-2];W[i]=(W[i-16]+(rr(x,7)^rr(x,18)^(x>>>3))+W[i-7]+(rr(y,17)^rr(y,19)^(y>>>10)))|0;}
      var t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,
          t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&cc)^(b&cc)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+hh)|0;
  }
  return H.map(function(v){return ('00000000'+(v>>>0).toString(16)).slice(-8);}).join('');
}
function normDob(s){
  var t=normDigits(String(s||'')).replace(/[^0-9]+/g,' ').trim(),g=t?t.split(' '):[];
  if(g.length===1&&g[0].length===8)g=[g[0].slice(0,2),g[0].slice(2,4),g[0].slice(4)];
  if(g.length!==3)return '';
  if(g[0].length===4)g=[g[2],g[1],g[0]];
  var d=+g[0],m=+g[1],y=+g[2];if(y<100)y+=2000;
  if(!(d>=1&&d<=31&&m>=1&&m<=12&&y>=1990&&y<=2100))return '';
  return ('0'+d).slice(-2)+('0'+m).slice(-2)+y;
}
function maskDob(v){var d=normDigits(String(v||'')).replace(/[^0-9]/g,'').slice(0,8);

function sayName(name){
  if(!name)return;
  try{if(window.AndroidBridge&&AndroidBridge.speak){AndroidBridge.speak(name);return;}}catch(e){}
  try{
    if(!window.speechSynthesis)return;speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(name);u.lang=arVoice?arVoice.lang:'ar-SA';if(arVoice)u.voice=arVoice;
    u.volume=1;u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- render: player ---------- */
function growLine(n,stage){
  var k=K(),T=D.set,m=passes(k,n),next=stage<1?T.t1:stage<2?T.t2:T.t3,pct=stage>=3?100:Math.min(100,Math.round(m*100/T.t3));
  var arr=k.al[n]||[],weak=0;for(var a=1;a<=SURAHS[n][1];a++)if((arr[a]||0)<next)weak++;
  var msg=stage>=3?'ما شاء الله! حفظت هذه السورة 🌸':k.ready[n]?'🎤 جاهز للتسميع! سمّعها لوالديك':
    'سمعت كل آية <b>'+ar(m)+'</b> مرة · لتصير «'+LABELS[stage<1?1:stage<2?2:3].split(' —')[0]+'» اسمع كل آية '+ar(next)+' مرات'+(weak&&weak<SURAHS[n][1]?' (بقي '+ar(weak)+' آيات)':'');
  return '<div class="wrap growline">'+plantSvg(stage,n,44)+'<div style="flex:1;min-width:200px"><div style="font-size:16px">'+msg+'</div><div class="bar"><div style="width:'+pct+'%"></div></div></div>'+
    '<div class="row">'+
    '<button class="pill" style="background:#fff;color:var(--green);border:3px solid var(--green)" data-meaning="'+n+'">📖 المعنى</button>'+
    '<button class="pill" style="background:'+(tjOn()?'var(--green)':'#fff')+';color:'+(tjOn()?'#fff':'var(--green)')+';border:3px solid var(--green)" data-tjtoggle aria-pressed="'+tjOn()+'">🎨 تجويد</button>'+
    '<button class="pill" style="background:'+(S.hide?'#8E6BD8':'#fff')+';color:'+(S.hide?'#fff':'#4B2E9B')+';border:3px solid #8E6BD8" data-act="hide" aria-pressed="'+!!S.hide+'">'+(S.hide?'👁️ أظهر النص':'🙈 اختبر نفسك')+'</button>'+
    (k.ready[n]&&stage<3?
      (k.recs[n]&&k.recs[n].status==='pending'?'<span class="pill" style="background:#F2ECFF;color:#4B2E9B">🎙️ تسجيلك عند والديك</span>':'<button class="pill" style="background:#E4572E;color:#fff" data-rec="'+n+'">🎙️ سجّل تسميعك</button>')+
      '<button class="pill" style="background:var(--sun);color:var(--ink)" data-approve="'+n+'">🔐 الوالد: سمعته مباشرة ✔</button>':'')+
    '</div></div>'+
    (k.recs[n]&&k.recs[n].status==='rejected'&&stage<3?'<div class="wrap note" style="margin-top:6px;font-size:16px;color:#A3262A">↩ والدك يقول: تحتاج مراجعة أكثر. اسمع وكرّر ثم سجّل مرة أخرى 💪</div>':'');
}
function renderPlayer(){
  var el=document.getElementById('player');
  keepAwake(!!(S.sel&&S.playing));
  if(!S.sel){el.hidden=true;return;}
  el.hidden=false;el.classList.toggle('focus',!!(S.playing&&!S.hide&&!S.err));var st,R=D.set,memo=S.mode==='memo',n=S.sel,stage=K().prog[n]||0,total=SURAHS[n][1];
  if(S.err)st='تعذّر التشغيل — تأكد من الاتصال بالإنترنت';
  else if(S.done)st=memo?'🎉 انتهى التكرار — أحسنت يا '+esc(K().name)+'!':'🎉 أتممت سورة '+SURAHS[n][0]+' — أحسنت يا '+esc(K().name)+'!';
  else if(!S.started)st='جاهز — اضغط تشغيل، أو اضغط على أي آية';
  else if(S.phase==='b')st='بسم الله الرحمن الرحيم'+(memo?' · المقطع '+ar(S.rRep)+'/'+ar(repR()):'');
  else if(memo)st='الآية '+ar(S.cur)+' · التكرار '+ar(S.aRep)+'/'+ar(repA())+' · المقطع '+ar(S.rRep)+'/'+ar(repR())+(S.playing?'':' (متوقف)');
  else st='الآية '+ar(S.cur)+' من '+ar(total)+(S.playing?'':' (متوقف)');
  function step(label,val,down,up,suffix){
    return '<div class="step"><span>'+label+'</span><div><button data-act="'+down+'" aria-label="إنقاص '+label+'">−</button><b>'+ar(val)+(suffix||'')+'</b><button data-act="'+up+'" aria-label="زيادة '+label+'">+</button></div></div>';
  }
  document.getElementById('shead').innerHTML='<div class="wrap shrow">'+
    '<button class="back" data-act="close"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>الحديقة</button>'+
    '<div style="flex:1 1 200px"><div class="stitle">سورة '+SURAHS[n][0]+'</div><div style="font-size:15px">'+ar(total)+' آيات · الشيخ مشاري راشد العفاسي</div></div>'+
    '<div class="modes" role="group" aria-label="طريقة القراءة"><button class="'+(memo?'':'on')+'" data-act="modeRead" aria-pressed="'+!memo+'">📖 قراءة</button><button class="'+(memo?'on':'')+'" data-act="modeMemo" aria-pressed="'+memo+'">🔁 حفظ وتكرار</button></div>'+
    '</div>'+growLine(n,stage);
  document.getElementById('pctrl').innerHTML='<div class="wrap prow">'+
    '<div style="display:flex;align-items:center;gap:14px;flex:1 1 240px">'+
      '<button class="play'+(S.playing?' on':'')+'" data-act="toggle" aria-label="'+(S.playing?'إيقاف مؤقت':'تشغيل')+'">'+(S.playing?PAUSE_ICON:PLAY_ICON)+'</button>'+
      '<div><div class="status" aria-live="polite" style="font-size:19px">'+st+'</div><div class="hint">اضغط على أي آية لتبدأ منها</div></div></div>'+
    (memo?'<div class="steps">'+step('من الآية',S.from,'fromDown','fromUp')+step('إلى الآية',S.to,'toDown','toUp')+
      step('كرّر كل آية',R.ayahRep,'arDown','arUp','×')+step('كرّر المقطع',R.rangeRep,'rrDown','rrUp','×')+'</div>':'')+
    '<div class="row">'+(memo?'<button class="ghost" data-act="whole">السورة كاملة</button>':'')+
      '<button class="ghost" data-act="restart">من البداية</button></div>'+
    '</div>'+(S.err?'<div class="wrap err">تعذّر تشغيل الصوت. تأكد من الاتصال بالإنترنت ثم اضغط تشغيل.</div>':'');
  renderReader();
}

/* ---------- in-app update (Android app only): newest GitHub release → download → install ---------- */
var UPD_REPO='MuhammadToffaha/Quran-Garden';
var UPD={cur:0,latest:0,url:'',notes:'',state:'',pct:0,checked:0,err:''};
function isAndroidApp(){try{return !!(window.AndroidBridge&&AndroidBridge.versionCode);}catch(e){return false;}}
function updCheck(force){
  if(!isAndroidApp())return Promise.resolve();
  try{UPD.cur=AndroidBridge.versionCode();}catch(e){}
  var cache=null;try{cache=JSON.parse(localStorage.getItem('qg-upd')||'null');}catch(e){}
  if(!force&&cache&&Date.now()-cache.t<6*3600e3){Object.assign(UPD,{latest:cache.n,url:cache.u,notes:cache.m,body:cache.b||'',checked:cache.t});updRefresh();return Promise.resolve();}
  return fetch('https://api.github.com/repos/'+UPD_REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'}})
    .then(function(r){if(!r.ok)throw r.status;return r.json();})
    .then(function(j){
      var m=/^v?\d+\.(\d+)$/.exec(j.tag_name||''),a=(j.assets||[]).filter(function(x){return /\.apk$/i.test(x.name);})[0];
      UPD.latest=m?+m[1]:0;UPD.url=a?a.browser_download_url:'';UPD.notes=j.name||'';UPD.body=String(j.body||'').slice(0,4000);UPD.checked=Date.now();UPD.err='';
      try{localStorage.setItem('qg-upd',JSON.stringify({n:UPD.latest,u:UPD.url,m:UPD.notes,b:UPD.body,t:UPD.checked}));}catch(e){}
      updRefresh();
    }).catch(function(e){UPD.err='تعذّر التحقق من التحديثات ('+e+')';updRefresh();});
}
function notesHtml(md){
  var out='',inList=false;String(md||'').split(/\r?\n/).forEach(function(l){
    l=l.trim();if(!l){if(inList){out+='</ul>';inList=false;}return;}
    var li=/^[-*•]\s+(.*)$/.exec(l),hd=/^#{1,4}\s+(.*)$/.exec(l);
    var txt=function(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');};
    if(li){if(!inList){out+='<ul>';inList=true;}out+='<li>'+txt(li[1])+'</li>';}
    else{if(inList){out+='</ul>';inList=false;}out+=hd?'<p class="nh">'+txt(hd[1])+'</p>':'<p>'+txt(l)+'</p>';}
  });
  if(inList)out+='</ul>';return out;
}
var HIST={list:null,err:''};
function loadHistory(){
  return fetch('https://api.github.com/repos/'+UPD_REPO+'/releases?per_page=10',{headers:{Accept:'application/vnd.github+json'}})
    .then(function(r){if(!r.ok)throw r.status;return r.json();}).then(function(j){HIST.list=j.map(function(x){return {tag:x.tag_name,date:String(x.published_at||'').slice(0,10),body:x.body||''};});HIST.err='';})
    .catch(function(e){HIST.err='تعذّر تحميل سجل التحديثات ('+e+')';});
}
function historyHtml(){
  if(!HIST.list)return '<p class="note">'+(HIST.err||'⏳ جارٍ التحميل…')+'</p>';
  return HIST.list.map(function(r){var m=/^v?\d+\.(\d+)$/.exec(r.tag),n=m?+m[1]:0;
    return '<details class="updnotes"'+(n===UPD.cur?' open':'')+'><summary><b dir="ltr">'+esc(r.tag)+'</b> · '+esc(r.date)+(n===UPD.cur?' ← المثبّت عندك':n>UPD.cur&&UPD.cur?' 🆕':'')+'</summary>'+notesHtml(r.body)+'</details>';}).join('');
}
function updAvailable(){return isAndroidApp()&&UPD.latest>UPD.cur&&!!UPD.url;}
function updStatusText(){
  if(UPD.state==='progress')return '⬇️ جارٍ التنزيل… '+ar(UPD.pct)+'٪';
  if(UPD.state==='ready')return '📦 اضغط «تثبيت» في نافذة أندرويد';
  if(UPD.state==='permission')return '🔓 اسمح لـ«حديقة القرآن» بتثبيت التطبيقات، ثم ارجع واضغط «تحديث» مرة أخرى';
  if(UPD.state==='error')return '⚠️ تعذّر التحديث — تأكد من الإنترنت وحاول مرة أخرى';
  return '';
}
function updBannerHtml(){
  if(!updAvailable())return '';
  var st=updStatusText();
  return '<section class="updbanner" role="status"><div><b>🎁 تحديث جديد متوفر!</b> <span dir="ltr">v1.'+UPD.latest+'</span>'+
    '<div class="updst">الإصدار الحالي <b dir="ltr">v1.'+UPD.cur+'</b> ← الجديد <b dir="ltr">v1.'+UPD.latest+'</b></div>'+
    (UPD.body?'<details class="updnotes"><summary>✨ ما الجديد؟</summary>'+notesHtml(UPD.body)+'</details>':'')+
    (st?'<div class="updst">'+st+'</div>':'')+'</div>'+
    (UPD.state==='progress'?'':'<button class="pill" style="background:var(--sun);color:var(--ink)" data-update>⬇️ تحديث الآن</button>')+'</section>';
}
function updateBoxHtml(){
  if(!isAndroidApp())return '<div class="box"><h3>🔄 التحديثات</h3><p class="note">التحديث من داخل التطبيق متاح في تطبيق أندرويد فقط.</p></div>';
  return '<div class="box"><h3>🔄 التحديثات</h3><p>الإصدار الحالي: <b dir="ltr">v1.'+UPD.cur+'</b>'+
    (UPD.latest?' · أحدث إصدار: <b dir="ltr">v1.'+UPD.latest+'</b>':'')+'</p>'+
    (updAvailable()?'<p>'+(updStatusText()||'🎁 يوجد تحديث جديد')+'</p><button class="btn" data-update>⬇️ تحديث الآن</button>':
      (UPD.latest?'<p>✅ لديك أحدث إصدار</p>':''))+
    (UPD.err?'<p style="color:#A3262A">'+esc(UPD.err)+'</p>':'')+
    ' <button class="btn alt" data-updcheck>🔍 التحقق الآن</button>'+
    '<h3 style="margin:16px 0 6px">📋 سجل التحديثات</h3>'+historyHtml()+'</div>';
}
function updRefresh(){
  var m=document.getElementById('main'),b=m&&m.querySelector('.updbanner'),html=updBannerHtml();
  if(b){if(html)b.outerHTML=html;else b.remove();}else if(html&&m)m.insertAdjacentHTML('afterbegin',html);
  if(!document.getElementById('parentOv').hidden&&PT==='backup')renderParent();
}
window.qgUpdateState=function(state,val){UPD.state=state;UPD.pct=val||0;updRefresh();if(state==='ready')setTimeout(function(){UPD.state='';updRefresh();},8000);};
function updStart(){
  if(!updAvailable())return;
  UPD.state='progress';UPD.pct=0;updRefresh();
  try{AndroidBridge.installUpdate(UPD.url);}catch(e){UPD.state='error';updRefresh();}
}
if(isAndroidApp()){setTimeout(function(){updCheck(false);},1500);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){if(UPD.state==='permission'){UPD.state='';updRefresh();}updCheck(false);}});}

/* changes saved elsewhere on this device (another tab / the installed app) show up instantly */
window.addEventListener('storage',function(e){
  if(e.key!==KEY||!e.newValue)return;
  try{var nd=JSON.parse(e.newValue);if(nd&&Array.isArray(nd.kids)){var cur=D.kid;D=nd;D.kid=cur<D.kids.length?cur:0;normAll();lastStationKid=null;render();if(!document.getElementById('parentOv').hidden)renderParent();}}catch(err){}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)keepAwake(!!(S.sel&&S.playing));});
render();

/* Android back button (called by the app shell): close the top-most layer, return true if handled */
window.qgBack=function(){
  if(G){closeGame();return true;}
  if(!document.getElementById('recOv').hidden){recCancel();return true;}
  var ids=['cheerOv','gateOv','certOv','quizOv','meanOv','badgeOv','welcomeOv','parentOv'];
  for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i]);if(!el.hidden){el.hidden=true;if(ids[i]==='parentOv')render();return true;}}
  if(S.sel){closeSurah();return true;}
  return false;
};
